<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY Loja</title>
    <link rel="stylesheet" href="./src/css/styles.css">
</head>

<body>
    <header class="header">

        <div class="logo">
            <span>NewClick</span>
        </div>

        <nav class="menu">

            <ul>
                <li><a href="#inicio">Início</a></li>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>

        </nav>
    </header>
    <main class="main">

        <h1>Bem-vindo à nossa loja</h1>
        <button type="button" class="btn-comprar">Comprar agora</button>

        <section class="produtos-container">

            <h2>Produtos</h2>

            <div class="card-container">
                <div class="card-produto">
                    <img src="./src/images/heaset.jpg" alt="headset usb" >
                    <p class="descricao">Headset usb</p>
                    <p class="valor">R$ 90,50</p>
                    <button type="button" class="btn-card">Comprar</button>
                </div>

                <div class="card-produto">
                    <img src="./src/images/notebook.jpg" alt="notebook dell" >
                    <p class="descricao">Notebook dell 14</p>
                    <p class="valor">R$ 1980,00</p>
                    <button type="button" class="btn-card">Comprar</button>
                </div>

                <div class="card-produto">
                    <img src="./src/images/iphone.jpg" alt="iphone 13">
                    <p class="descricao">Iphone 13</p>
                    <p class="valor">R$ 6.000,00</p>
                    <button type="button" class="btn-card">Comprar</button>
                </div>

                

            </div>
        </section>

    </main>

    <footer class="footer">
        <h3>Todos os direitos são reservados - NewClick 2026</h3>
    </footer>
</body>

</html>
